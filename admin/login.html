<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Login | Ranjithkumar R</title>

  <meta
    name="description"
    content="Admin login panel for Ranjithkumar R portfolio"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #03050a;
      --surface: #060b12;
      --card: #0a1018;
      --border: #162030;

      --accent: #00e5ff;
      --accent2: #7c3aed;

      --text: #e2e8f0;
      --muted: #64748b;

      --glow: rgba(0, 229, 255, 0.18);
      --glow2: rgba(124, 58, 237, 0.18);

      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Space Grotesk", sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(0, 229, 255, 0.09),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(124, 58, 237, 0.11),
          transparent 30%
        ),
        var(--bg);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
      overflow-x: hidden;
    }

    /* Background grid */

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        );

      background-size: 40px 40px;

      mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.8),
        transparent
      );

      pointer-events: none;
      z-index: -1;
    }

    /* Login wrapper */

    .login-wrapper {
      width: 100%;
      max-width: 440px;
    }

    /* Brand */

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 70px;
      height: 70px;

      margin: 0 auto 16px;

      border-radius: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "JetBrains Mono", monospace;
      font-size: 26px;
      font-weight: 700;

      color: var(--accent);

      background:
        linear-gradient(
          135deg,
          rgba(0, 229, 255, 0.12),
          rgba(124, 58, 237, 0.16)
        );

      border: 1px solid rgba(0, 229, 255, 0.25);

      box-shadow:
        0 0 35px rgba(0, 229, 255, 0.12),
        inset 0 0 20px rgba(124, 58, 237, 0.08);
    }

    .brand h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand h1 span {
      color: var(--accent);
    }

    .brand p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    /* Login card */

    .login-card {
      position: relative;

      background: rgba(10, 16, 24, 0.88);

      border: 1px solid var(--border);

      border-radius: 22px;

      padding: 32px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        0 0 50px rgba(0, 229, 255, 0.04);

      backdrop-filter: blur(20px);
    }

    .login-card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 12%;
      right: 12%;

      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        var(--accent),
        var(--accent2),
        transparent
      );
    }

    .login-title {
      margin-bottom: 25px;
    }

    .login-title h2 {
      font-size: 21px;
      margin-bottom: 6px;
    }

    .login-title p {
      color: var(--muted);
      font-size: 13px;
    }

    /* Form */

    .form-group {
      margin-bottom: 19px;
    }

    .form-group label {
      display: block;

      margin-bottom: 8px;

      font-size: 13px;
      font-weight: 600;

      color: #cbd5e1;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;

      left: 15px;
      top: 50%;

      transform: translateY(-50%);

      color: var(--muted);

      font-size: 16px;

      pointer-events: none;
    }

    .form-input {
      width: 100%;

      height: 48px;

      padding: 0 15px 0 44px;

      border-radius: 12px;

      border: 1px solid var(--border);

      outline: none;

      background: #050a11;

      color: var(--text);

      font-family: "Space Grotesk", sans-serif;
      font-size: 14px;

      transition: 0.25s ease;
    }

    .form-input::placeholder {
      color: #475569;
    }

    .form-input:focus {
      border-color: rgba(0, 229, 255, 0.55);

      box-shadow:
        0 0 0 3px rgba(0, 229, 255, 0.08),
        0 0 20px rgba(0, 229, 255, 0.06);
    }

    /* Password */

    .password-toggle {
      position: absolute;

      right: 13px;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: transparent;

      color: var(--muted);

      cursor: pointer;

      font-size: 16px;

      padding: 5px;
    }

    .password-toggle:hover {
      color: var(--accent);
    }

    /* Remember */

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin: 5px 0 22px;

      font-size: 12px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;

      color: var(--muted);

      cursor: pointer;
    }

    .remember input {
      accent-color: var(--accent);
    }

    .forgot {
      color: var(--accent);

      text-decoration: none;

      cursor: pointer;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    /* Login button */

    .login-button {
      width: 100%;

      height: 50px;

      border: none;

      border-radius: 12px;

      cursor: pointer;

      color: #001015;

      background: linear-gradient(
        135deg,
        var(--accent),
        #22d3ee
      );

      font-family: "Space Grotesk", sans-serif;

      font-size: 14px;
      font-weight: 700;

      transition: 0.25s ease;

      box-shadow:
        0 10px 30px rgba(0, 229, 255, 0.12);
    }

    .login-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 14px 35px rgba(0, 229, 255, 0.22);
    }

    .login-button:active {
      transform: translateY(0);
    }

    /* Error */

    .error-message {
      display: none;

      margin-top: 15px;

      padding: 11px 13px;

      border-radius: 10px;

      border: 1px solid rgba(239, 68, 68, 0.25);

      background: rgba(239, 68, 68, 0.08);

      color: #fca5a5;

      font-size: 12px;

      text-align: center;
    }

    .error-message.show {
      display: block;
    }

    /* Security */

    .security-note {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      margin-top: 20px;

      color: var(--muted);

      font-family: "JetBrains Mono", monospace;

      font-size: 10px;
    }

    .security-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #22c55e;

      box-shadow: 0 0 10px rgba(34, 197, 94, 0.7);
    }

    /* Back */

    .back-link {
      display: block;

      margin-top: 22px;

      text-align: center;

      color: var(--muted);

      font-size: 13px;

      text-decoration: none;

      transition: 0.2s ease;
    }

    .back-link:hover {
      color: var(--accent);
    }

    /* Footer */

    .footer {
      text-align: center;

      margin-top: 24px;

      color: #475569;

      font-size: 11px;
    }

    .footer span {
      color: var(--accent);
    }

    /* Loading */

    .login-button.loading {
      pointer-events: none;
      opacity: 0.75;
    }

    .login-button.loading::after {
      content: " ...";
    }

    /* Mobile */

    @media (max-width: 500px) {

      body {
        padding: 18px;
      }

      .brand {
        margin-bottom: 22px;
      }

      .brand-icon {
        width: 60px;
        height: 60px;

        border-radius: 17px;

        font-size: 22px;
      }

      .brand h1 {
        font-size: 23px;
      }

      .brand p {
        font-size: 12px;
      }

      .login-card {
        padding: 24px 20px;

        border-radius: 18px;
      }

      .login-title h2 {
        font-size: 19px;
      }

      .form-input {
        height: 47px;
      }

      .login-button {
        height: 48px;
      }
    }

    @media (max-width: 350px) {

      body {
        padding: 12px;
      }

      .login-card {
        padding: 20px 16px;
      }

      .form-options {
        flex-direction: column;
        align-items: flex-start;

        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <main class="login-wrapper">

    <!-- BRAND -->

    <div class="brand">

      <div class="brand-icon">
        &lt;/&gt;
      </div>

      <h1>
        Ranjithkumar <span>R</span>
      </h1>

      <p>
        Portfolio Administration
      </p>

    </div>


    <!-- LOGIN CARD -->

    <section class="login-card">

      <div class="login-title">

        <h2>
          Welcome back 👋
        </h2>

        <p>
          Sign in to manage your portfolio.
        </p>

      </div>


      <form id="loginForm">

        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              ✉
            </span>

            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="admin@example.com"
              autocomplete="email"
              required
            />

          </div>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="input-wrapper">

            <span class="input-icon">
              🔒
            </span>

            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>


        <!-- OPTIONS -->

        <div class="form-options">

          <label class="remember">

            <input
              type="checkbox"
              id="remember"
            />

            Remember me

          </label>

          <a
            href="#"
            class="forgot"
            id="forgotPassword"
          >
            Forgot password?
          </a>

        </div>


        <!-- BUTTON -->

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          Sign In to Dashboard
        </button>


        <!-- ERROR -->

        <div
          class="error-message"
          id="errorMessage"
        ></div>

      </form>


      <!-- SECURITY -->

      <div class="security-note">

        <span class="security-dot"></span>

        Secure Admin Area

      </div>

    </section>


    <!-- BACK -->

    <a
      href="../index.html"
      class="back-link"
    >
      ← Back to Portfolio
    </a>


    <div class="footer">

      © 2026 Ranjithkumar R ·
      <span>Admin Panel</span>

    </div>

  </main>


  <script>

    const loginForm =
      document.getElementById("loginForm");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const errorMessage =
      document.getElementById("errorMessage");

    const togglePassword =
      document.getElementById("togglePassword");

    const forgotPassword =
      document.getElementById("forgotPassword");


    /* Show / Hide Password */

    togglePassword.addEventListener(
      "click",
      function () {

        if (password.type === "password") {

          password.type = "text";

          togglePassword.textContent = "🙈";

        } else {

          password.type = "password";

          togglePassword.textContent = "👁";

        }

      }
    );


    /* Forgot Password */

    forgotPassword.addEventListener(
      "click",
      function (event) {

        event.preventDefault();

        showError(
          "Password reset will be connected to the backend in the next step."
        );

      }
    );


    /* Login */

    loginForm.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();

        errorMessage.classList.remove("show");

        const emailValue =
          email.value.trim();

        const passwordValue =
          password.value.trim();


        if (!emailValue || !passwordValue) {

          showError(
            "Please enter your email and password."
          );

          return;

        }


        /*
          TEMPORARY LOGIN FLOW

          This is only for testing the admin UI.

          Real authentication will be added with:
          Node.js + Express + MongoDB + JWT
        */

        loginButton.classList.add("loading");

        loginButton.textContent =
          "Signing in";


        setTimeout(
          function () {

            sessionStorage.setItem(
              "adminDemoLoggedIn",
              "true"
            );

            window.location.href =
              "./index.html";

          },
          700
        );

      }
    );


    /* Error */

    function showError(message) {

      errorMessage.textContent =
        message;

      errorMessage.classList.add("show");

    }

  </script>

</body>
</html>
